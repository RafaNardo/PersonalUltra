services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: personal_ultra
      POSTGRES_USER: personal_ultra
      POSTGRES_PASSWORD: personal_ultra
    ports:
      - "5432:5432"
    volumes:
      - personal-ultra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ultra -d personal_ultra"]
      interval: 5s
      timeout: 5s
      retries: 12

  student-api:
    build:
      context: .
      dockerfile: apps/api/StudentApi/Containerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PersonalUltraDatabase: Host=postgres;Port=5432;Database=personal_ultra;Username=personal_ultra;Password=personal_ultra
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  trainer-api:
    build:
      context: .
      dockerfile: apps/api/TrainerApi/Containerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PersonalUltraDatabase: Host=postgres;Port=5432;Database=personal_ultra;Username=personal_ultra;Password=personal_ultra
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  personal-ultra-postgres-data:
