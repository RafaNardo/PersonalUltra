services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: svr_method
      POSTGRES_USER: svr
      POSTGRES_PASSWORD: svr
    ports:
      - "5432:5432"
    volumes:
      - svr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svr -d svr_method"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      dockerfile: Containerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SvrDatabase: Host=postgres;Port=5432;Database=svr_method;Username=svr;Password=svr
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  svr-postgres-data:
